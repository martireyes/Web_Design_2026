<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Ejercicio Unidad 6</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="style_formulario.css">
    </head>
    <body>
        <header class="header">
            <h1>Bienvenido a mi ejercicio de la Unidad 6</h1>
        </header>
        <nav class="nav">
            <ul>
                <li><a href="#home">Inicio</a></li>
                <li><a href="#about">Sobre mí</a></li>
                <li><a href="#contact">Contacto</a></li>
            </ul>
        </nav>

        <main class="content">
            <section id="home">
                <h2>Inicio</h2>
                <p>Este es el contenido de la página principal.</p>
            </section>
            <section id="about">
                <h2>Sobre mí</h2>
                <p>Mi nombre es Martín Reyes y este es el ejercicio de la Unidad 6.</p>
            </section>
            <section id="contact">
                <div class="formulario">
                    <h2>Formulario de Contacto</h2>
                    <form id="contactForm">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                        <label for="email">Correo Electr&oacute;nico:</label>
                        <input type="email" id="email" name="email" required>
                        <label for="message">Mensaje:</label>
                        <textarea id="message" name="message" required></textarea>
                        <input type="submit" value="Enviar">
                    </form>
                    <p id="errorMessage" style="color: red;"></p>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>© 2026 Mi Página Web - Ejercicio 6</p>
        </footer>
    </body>
</html>
